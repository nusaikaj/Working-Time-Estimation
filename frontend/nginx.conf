server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: any path that isn't a real static file falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API access in production — the browser only ever talks to
  # this Nginx origin; it forwards to the backend container over the
  # internal Docker network. `^~` stops Nginx from also matching this against
  # the file-extension regex location below (e.g. an endpoint ending in .json).
  location ^~ /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded profile photos, served by the backend. Same `^~` reasoning as
  # /api/ — without it, the *.png/*.jpg regex location below would win and
  # try (and fail) to serve these from the static build output instead.
  location ^~ /uploads/ {
    proxy_pass http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(?:css|js|svg|woff2?|ttf|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
