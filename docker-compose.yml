services:
  mysql:
    image: mysql:8.0
    container_name: wte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wte_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wte_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - wte_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wte_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    networks:
      - wte_network

networks:
  wte_network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
